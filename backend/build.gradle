plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tilink'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// WebClient 로 FastAPI(ai-service)를 호출하기 위해 추가. 서버 자체는 계속 Web MVC 로 돈다.
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// pgvector 의 vector 타입을 JPA 엔티티의 float[] 필드로 매핑해 주는 Hibernate 공식 모듈
	implementation 'org.hibernate.orm:hibernate-vector'
	// JWT 생성/검증. api 만 컴파일 시점에 쓰고, impl/jackson 은 런타임에 구현체로 로드된다.
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	// jjwt-jackson 은 Jackson 2 를 쓴다. Spring Boot 4 는 Jackson 3(tools.jackson)을 쓰므로
	// 둘이 공존하며, jjwt 가 끌고 오는 낡은 2.12 대신 최신 2.x 를 명시해 고정한다.
	runtimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 운영 코드에는 jwt.secret 기본값이 없으므로, 테스트에서만 쓸 서명 키를 여기서 주입한다.
	// 실제 배포에 쓰이지 않는 값이며 토큰 서명 검증이 동작하는지만 확인하는 용도다.
	environment 'JWT_SECRET', 'tilink-test-only-secret-key-not-for-any-real-deployment'
}
