server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: tilink-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/tilink}
    username: ${DB_USERNAME:tilink}
    password: ${DB_PASSWORD:tilink}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    "[org.hibernate.SQL]": debug
